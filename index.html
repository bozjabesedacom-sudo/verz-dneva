<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verz dneva | Božja Beseda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .page {
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 38px 28px 28px;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.28),
          rgba(0,0,0,.18) 35%,
          rgba(0,0,0,.46) 72%,
          rgba(0,0,0,.75)
        ),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=90")
        center / cover no-repeat;
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 34px;
      line-height: 1;
      margin-top: 10px;
    }

    .content {
      margin-top: auto;
      margin-bottom: auto;
      max-width: 680px;
    }

    .reference {
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .verse {
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 40px);
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: .5px;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .bottom-nav{
    position:fixed;
    bottom:28px;
    left:0;
    right:0;

    display:flex;
    justify-content:space-evenly;

    max-width:500px;
    margin:auto;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;

    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:400;
}

.nav-item img{
    width:60px;
    height:60px;
}

    select {
      appearance: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      outline: none;
    }

    select option {
      color: black;
    }

    @media (min-width: 700px) {
      .page {
        padding: 50px 70px 40px;
      }

      .content {
        width: 100%;
        max-width: 820px;
      }

      .bottom-nav {
        max-width: 760px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
      }
       content {
text-align: center;
}
 reference {
text-align: center;
｝
Verse i text-align: center;
   }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
  <img src="logo.png" alt="Božja Beseda" style="width:80px; height:auto;">
</div>

    <section class="content">
      <div class="reference" id="reference">1 Peter 1:3</div>

      <p class="verse" id="verse">
        Slavljen Bog in Oče našega Gospoda Jezusa Kristusa! Po svojem velikem usmiljenju nas je prerodil za živo upanje.
      </p>
    </section>

    <nav class="bottom-nav">

<a class="nav-item" id="chapterLink" href="https://www.biblija.net/biblija.cgi?l=sl" target="_blank">
    <img src="book.png" alt="Book">
    <span>Preberi poglavje</span>
</a>

<a class="nav-item" href="https://bozjabeseda.com" target="_blank">
    <img src="shop.png" alt="Shop">
    <span>Trgovina</span>
</a>

</nav>
  </main>

  <script>
    const verses = [
      {
        sl: {
          reference: "1 Peter 1:3",
          text: "Slavljen Bog in Oče našega Gospoda Jezusa Kristusa! Po svojem velikem usmiljenju nas je prerodil za živo upanje.",
          chapter: "https://www.biblija.net/biblija.cgi?m=1+Pt+1"
        },
        en: {
          reference: "1 Peter 1:3",
          text: "Praise be to the God and Father of our Lord Jesus Christ! In his great mercy he has given us new birth into a living hope.",
          chapter: "https://www.biblegateway.com/passage/?search=1%20Peter%201"
        }
      },
      {
        sl: {
          reference: "Psalm 23:1",
          text: "Gospod je moj pastir, nič mi ne manjka.",
          chapter: "https://www.biblija.net/biblija.cgi?m=Ps+23"
        },
        en: {
          reference: "Psalm 23:1",
          text: "The Lord is my shepherd; I shall not want.",
          chapter: "https://www.biblegateway.com/passage/?search=Psalm%2023"
        }
      },
      {
        sl: {
          reference: "Filipljanom 4:13",
          text: "Vse zmorem v njem, ki mi daje moč.",
          chapter: "https://www.biblija.net/biblija.cgi?m=Flp+4"
        },
        en: {
          reference: "Philippians 4:13",
          text: "I can do all things through Christ who strengthens me.",
          chapter: "https://www.biblegateway.com/passage/?search=Philippians%204"
        }
      }
    ];

    const startDate = new Date("2026-01-01T00:00:00");
    const today = new Date();

    const dayNumber = Math.floor(
      (today.setHours(0,0,0,0) - startDate.getTime()) / 86400000
    );

    const verseIndex =
      ((dayNumber % verses.length) + verses.length) % verses.length;

    const languageSelect = document.getElementById("language");

    function showVerse(language) {
      const selected = verses[verseIndex][language];

      document.getElementById("reference").textContent = selected.reference;
      document.getElementById("verse").textContent = selected.text;
      document.getElementById("chapterLink").href = selected.chapter;
    }

    languageSelect.addEventListener("change", function () {
      showVerse(this.value);
    });

    showVerse("sl");
  </script>

</body>
</html>
