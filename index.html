<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verz dneva</title>

  <style>
    body{
      margin:0;
      font-family:Georgia,serif;
      background:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1500&q=80") center/cover;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .box{
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(10px);
      padding:40px;
      border-radius:25px;
      max-width:700px;
      width:90%;
      text-align:center;
    }

    h1{
      font-size:18px;
      letter-spacing:3px;
    }

    #verse{
      font-size:32px;
      font-style:italic;
      margin:30px 0;
    }

    button{
      width:100%;
      padding:18px;
      margin-top:15px;
      border:none;
      border-radius:50px;
      font-size:18px;
      cursor:pointer;
    }

    .white{
      background:white;
    }

    .gold{
      background:#d4af37;
      color:white;
    }
  </style>
</head>

<body>

<div class="box">

<h1>VERZ DNEVA</h1>

<p id="verse">
Bog je ljubezen.
</p>

<button class="white">
Preberi celotno poglavje
</button>

<button class="gold">
Kupi zapestnice
</button>

</div>

</body>
</html>
