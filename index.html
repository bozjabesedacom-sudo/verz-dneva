<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verz dneva | Božja Beseda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .page {
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 38px 28px 28px;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.28),
          rgba(0,0,0,.18) 35%,
          rgba(0,0,0,.46) 72%,
          rgba(0,0,0,.75)
        ),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=90")
        center / cover no-repeat;
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 34px;
      line-height: 1;
      margin-top: 10px;
    }

    .content {
    display: flex;
    flex-direction: column;
    justify-content: center;

    height: 65vh;
    max-width: 680px;

    margin-top: -40px;
    margin-bottom: auto;
}

    .reference {
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .verse {
      font-family: Georgia, serif;
      font-size: clamp(24px, 6vw, 40px);
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: .5px;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

  .bottom-nav{
    position:fixed;
    bottom:28px;
    left:0;
    right:0;

    display:flex;
    justify-content:space-evenly;

    width:100%;
    max-width:560px;
    margin:auto;
}

.nav-item{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:400;
}
.center,
.right{
    flex-direction:column;
}

.left{
    flex:1;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:-3px;
}
.left span{
    margin-left:-15px;
}
.left img{
    width:42px;
    height:42px;
}

.left div{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.left span{
    color:white;
    font-size:15px;
    font-weight:250;
    line-height:1.05;
    text-align:left;
}

.center{
    flex:1;
    display:flex;
    justify-content:center;
}

.right{
    flex:1;
    display:flex;
    justify-content:flex-end;
  padding-right:-5px;
}
.nav-item img{
    width:70px;
    height:70px;
}


    select {
      appearance: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      outline: none;
    }

    select option {
      color: black;
    }

    @media (min-width: 700px) {
      .page {
        padding: 50px 70px 40px;
      }

      .content {
        width: 100%;
        max-width: 820px;
      }

      .bottom-nav {
        max-width: 760px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
      }

  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
  <img src="logo.png" alt="Božja Beseda" style="width:100px; height:auto;">
</div>

    <section class="content">
      <div class="reference" id="reference">1 Peter 1:3</div>

      <p class="verse" id="verse">
        Slavljen Bog in Oče našega Gospoda Jezusa Kristusa! Po svojem velikem usmiljenju nas je prerodil za živo upanje.
      </p>
    </section>

    <nav class="bottom-nav">

   <a class="nav-item left" id="chapterLink" href="https://www.biblija.net/biblija.cgi?l=sl" target="_blank">
    <img src="book.png" alt="Book">
    <div>
        <span>Preberi</span>
        <span>poglavje</span>
    </div>
</a>
    <a class="nav-item center" href="https://bozjabeseda.com" target="_blank">
        <img src="shop.png" alt="Shop">
    </a>

    <a class="nav-item right" href="https://www.facebook.com/profile.php?id=61586859381357" target="_blank">
        <img src="social.png" alt="Facebook">
    </a>

</nav>
  </main>

  <script src="verzi365.js"></script>

<script>
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Ljubljana",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const year = Number(parts.find(p => p.type === "year").value);
  const month = Number(parts.find(p => p.type === "month").value);
  const day = Number(parts.find(p => p.type === "day").value);

  const today = Date.UTC(year, month - 1, day);
  const start = Date.UTC(year, 0, 1);

  const dayOfYear = Math.floor((today - start) / 86400000);

  const verseIndex = dayOfYear % verses.length;
  const selected = verses[verseIndex];

  document.getElementById("reference").textContent = selected.reference;
  document.getElementById("verse").textContent = selected.text;
  document.getElementById("chapterLink").href = selected.chapter;

  // Avtomatsko ozadje dneva
const bgCount = 150;
const bgIndex = (dayOfYear % bgCount) + 1;

document.querySelector(".page").style.backgroundImage = `
  linear-gradient(
    to bottom,
    rgba(0,0,0,.28),
    rgba(0,0,0,.18) 35%,
    rgba(0,0,0,.46) 72%,
    rgba(0,0,0,.75)
  ),
  url("https://loremflickr.com/1080/1920/nature,landscape,mountains,forest?lock=${bgIndex}")
`;
</script>

</body>
</html>
